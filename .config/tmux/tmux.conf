# ── tmux config for ltangen — OnePlus 7 Pro ──────────────────────────────────

# ── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-shell /bin/zsh

# ── General ──────────────────────────────────────────────────────────────────
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g display-time 2000
set -g status-interval 5

# ── Splits ───────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-like) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ──────────────────────────────────────────────────────────────────
bind -r [ previous-window
bind -r ] next-window
bind Tab last-window

# ── Copy mode (vi) ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Sessions ─────────────────────────────────────────────────────────────────
bind S choose-session
bind N new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ── Reload ───────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded!"

# ── Quick launchers ──────────────────────────────────────────────────────────
# Dev layout: nvim left | terminal right | logs bottom-right
bind D new-session -s dev -c ~/Projects/active \;\
  split-window -h -p 35 \;\
  split-window -v -p 40 \;\
  select-pane -t 1 \;\
  send-keys "nvim ." Enter

# AI session
bind A new-session -s ai -c ~/AI \;\
  split-window -h -p 40 \;\
  select-pane -t 1 \;\
  send-keys "ollama run qwen2.5-coder:7b" Enter \;\
  select-pane -t 2

# ── Status Bar (Catppuccin Mocha) ─────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa,nobold]"

set -g status-right "\
#[fg=#a6e3a1] #{?window_zoomed_flag, Z ,}\
#[fg=#fab387]#{?client_prefix, C-a ,}\
#[fg=#f38ba8]#{battery_percentage}\
#[fg=#cba6f7]  %H:%M \
#[fg=#89b4fa]  %d/%m/%Y "

setw -g window-status-format         " #I  #W "
setw -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I  #W #[bg=#1e1e2e,fg=#cba6f7]"
setw -g window-status-style          "fg=#6c7086"

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style            "bg=#1e1e2e,fg=#cba6f7"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'         # system clipboard

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'
